name: Manual Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
      api_url:
        description: API base URL (HTTPS)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          API_URL: ${{ inputs.api_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments must use the main branch."
            exit 1
          fi

          if [[ ! "$API_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::API_URL must be a valid HTTPS URL."
            exit 1
          fi

          if [[ "$API_URL" == *"/public/"* ]]; then
            echo "::error::API_URL must be the API base URL, without endpoint paths."
            exit 1
          fi

          for SECRET_NAME in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::$SECRET_NAME is missing in the $DEPLOY_ENVIRONMENT environment."
              exit 1
            fi
          done

      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify pnpm lockfile
        shell: bash
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml was not found in the repository root."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel

          printf '{"orgId":"%s","projectId":"%s"}' \
            "$VERCEL_ORG_ID" \
            "$VERCEL_PROJECT_ID" \
            > .vercel/project.json

      - name: Pull Vercel project settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment="$VERCEL_TARGET" \
            --token="$VERCEL_TOKEN"

      - name: Set API URL for Vercel build
        shell: bash
        env:
          API_URL: ${{ inputs.api_url }}
          VERCEL_TARGET: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = `.vercel/.env.${process.env.VERCEL_TARGET}.local`;
          const apiUrl = process.env.API_URL.replace(/\/+$/, "");

          const current = fs.existsSync(file)
            ? fs.readFileSync(file, "utf8")
            : "";

          const lines = current
            .split(/\r?\n/)
            .filter(
              (line) =>
                !/^\s*(?:export\s+)?VITE_API_BASE_URL\s*=/.test(line)
            );

          while (lines.length && lines.at(-1) === "") {
            lines.pop();
          }

          lines.push(`VITE_API_BASE_URL=${JSON.stringify(apiUrl)}`);

          fs.writeFileSync(file, `${lines.join("\n")}\n`);

          console.log(`VITE_API_BASE_URL configurada para: ${apiUrl}`);
          console.log(`Arquivo utilizado: ${file}`);
          NODE

      - name: Build frontend
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy frontend to Vercel
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            DEPLOYMENT=$(pnpm dlx vercel@latest deploy \
              --prebuilt \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN" \
              --json)
          else
            DEPLOYMENT=$(pnpm dlx vercel@latest deploy \
              --prebuilt \
              --yes \
              --token="$VERCEL_TOKEN" \
              --json)
          fi

          URL=$(echo "$DEPLOYMENT" | jq -r '.url // empty')

          if [ -z "$URL" ]; then
            echo "::error::Could not retrieve the deployment URL."
            echo "$DEPLOYMENT"
            exit 1
          fi

          case "$URL" in
            https://*) ;;
            *) URL="https://$URL" ;;
          esac

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        shell: bash
        env:
          API_URL: ${{ inputs.api_url }}
          FRONTEND_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "## Frontend Deployment"
            echo ""
            echo "- Environment: $DEPLOY_ENVIRONMENT"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Frontend URL: $FRONTEND_URL"
            echo "- API URL: $API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
